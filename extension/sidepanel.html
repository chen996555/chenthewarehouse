<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f7;
      color: #1F2329;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .app { display: flex; flex-direction: column; height: 100%; }
    /* 顶部 */
    .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(135deg,#3470FF,#1456F0); color: #fff; flex-shrink: 0; }
    .head .avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .head .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .head .sub { font-size: 13px; font-weight: 600; }
    /* 导航 */
    .nav { display: flex; gap: 2px; padding: 6px 8px 8px; flex-shrink: 0; border-top: 1px solid rgba(0,0,0,.05); background: rgba(255,255,255,.6); }
    .nav-item { flex: 1; padding: 6px 0; border: none; background: transparent; font-size: 11px; font-weight: 600; color: #8F959E; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; position: relative; }
    .nav-item:hover { color: #646A73; }
    .nav-item.active { color: #1456F0; }
    .nav-item.active::before { content: ''; position: absolute; top: -7px; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: #1456F0; }
    .nav-fill { color: #1456F0; }
    /* 视图区 */
    .view { flex: 1; overflow-y: auto; padding: 12px; }
    .progress { font-size: 12px; color: #646A73; padding: 0 14px 6px; min-height: 18px; flex-shrink: 0; }
    /* 底部 */
    .foot { border-top: 1px solid rgba(255,255,255,.6); padding: 10px 12px; display: flex; gap: 8px; flex-shrink: 0; background: rgba(255,255,255,.5); backdrop-filter: blur(12px); }
    /* 通用按钮 */
    .btn { padding: 9px 14px; border: none; border-radius: 16px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .ico { width: 16px; height: 16px; flex-shrink: 0; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #1456F0; color: #fff; }
    .btn-primary:hover { background: #133D9A; }
    .btn-ghost { background: #f3f4f6; color: #4E5969; }
    .btn-block { width: 100%; }
    /* 表单行 */
    .login-row { padding: 4px 2px; }
    .login-row input { width: 100%; padding: 9px 12px; border: 1px solid rgba(255,255,255,.7); border-radius: 10px; font-size: 13px; margin-top: 8px; box-sizing: border-box; background: rgba(255,255,255,.85); }
    .upload-row { padding: 4px 2px; }
    .upload-btn { display: inline-block; cursor: pointer; }
    .hint { font-size: 12px; color: #646A73; line-height: 1.6; margin: 6px 2px; }
    .glass-card { background: rgba(255,255,255,.72); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 14px; box-shadow: 0 8px 32px rgba(0,0,0,.08); margin-bottom: 10px; }
    /* 分档标签 */
    .tier { display: inline-block; background: #eff6ff; color: #2563eb; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; font-weight: 600; }
    /* live 实时卡片 */
    .live-title { font-size: 12px; color: #646A73; margin-bottom: 8px; }
    .live-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .live-card { display: inline-flex; flex-direction: column; background: #eff6ff; border: 1px solid #dbeafe; border-radius: 8px; padding: 5px 8px; text-decoration: none; color: inherit; max-width: 160px; }
    .live-card:hover { border-color: #1456F0; }
    .live-c { font-size: 10px; color: #1456F0; font-weight: 600; }
    .live-t { font-size: 11px; color: #1f2937; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .live-overflow { font-size: 11px; color: #8F959E; margin-top: 6px; }
    /* 推荐卡片（工作台）*/
    .rec-list { margin-top: 4px; }
    .wb-card { background: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.7); border-radius: 16px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.05); }
    .wb-head { display: flex; gap: 10px; align-items: flex-start; }
    .ring { width: 46px; height: 46px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
    .ring-in { position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
    .ring .val { position: relative; z-index: 1; font-size: 13px; font-weight: 700; color: #1F2329; }
    .wb-info { flex: 1; min-width: 0; }
    .wb-tt { font-size: 13px; font-weight: 600; color: #1F2329; line-height: 1.4; }
    .wb-c { font-size: 11px; color: #646A73; margin-top: 3px; }
    .wb-reason { font-size: 11px; color: #646A73; margin-top: 4px; line-height: 1.5; }
    .wb-flags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
    .flag-tag { font-size: 10px; color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; border-radius: 4px; padding: 1px 6px; }
    .wb-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .pt { font-size: 10px; padding: 2px 6px; border-radius: 4px; }
    .pt.ok { background: #f0fdf4; color: #16a34a; }
    .pt.warn { background: #fef2f2; color: #dc2626; }
    .match-dims { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .dim { display: flex; align-items: center; gap: 4px; }
    .dim-label { font-size: 10px; color: #646A73; }
    .dim-bar { width: 48px; height: 6px; border-radius: 3px; background: #eef1f5; overflow: hidden; }
    .dim-fill { height: 100%; border-radius: 3px; }
    .dim-fill.good { background: #16a34a; }
    .dim-fill.bad { background: #f59e0b; }
    .wb-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .apply-btn { padding: 6px 14px; border: none; border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; background: #1456F0; color: #fff; }
    .apply-btn:hover { background: #133D9A; }
    .tailor-btn { padding: 6px 12px; border: 1px solid #1456F0; border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; background: #fff; color: #1456F0; }
    .tailor-btn:hover { background: #eef3ff; }
    .add-board-btn { padding: 6px 12px; border: 1px solid #1456F0; border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; background: #fff; color: #1456F0; }
    .add-board-btn:hover { background: #eef3ff; }
    .add-board-btn:disabled { opacity: .6; cursor: not-allowed; }
    .apply-btn.done { background: #16a34a; }
    .apply-btn:disabled { opacity: .6; cursor: not-allowed; }
    .wb-link { font-size: 11px; color: #646A73; text-decoration: none; }
    .wb-link:hover { color: #1456F0; }
    .more-btn { width: 100%; padding: 9px; border: 1px dashed #cbd5e1; border-radius: 12px; background: rgba(255,255,255,.6); color: #1456F0; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .more-btn:hover { background: #eef3ff; border-color: #1456F0; }
    /* 投递记录 */
    .apply-item { background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.7); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .apply-item .a-top { font-size: 12px; font-weight: 600; color: #1F2329; }
    .apply-item .a-meta { font-size: 11px; color: #646A73; margin-top: 3px; }
    .st-pill { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
    /* 漏斗 */
    .funnel-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
    .funnel-bar { flex: 1; height: 16px; border-radius: 8px; background: #eef1f5; overflow: hidden; }
    .funnel-fill { height: 100%; border-radius: 8px; }
    .export-btn { width: 100%; padding: 9px; border: none; border-radius: 12px; background: #16a34a; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .search-input { width: 100%; padding: 9px 12px; border: 1px solid #e5e6e8; border-radius: 10px; font-size: 13px; margin-bottom: 8px; box-sizing: border-box; background: rgba(255,255,255,.85); color: #1F2329; }
    .search-input:focus { outline: none; border-color: #1456F0; }
    .field-label { display: block; font-size: 12px; font-weight: 600; color: #1F2329; margin: 10px 2px 4px; }
    .filter-bar { display: flex; gap: 8px; margin: 4px 0 12px; align-items: center; flex-wrap: wrap; }
    .filter-bar svg { width: 16px; height: 16px; stroke: #8F959E; flex: none; }
    .filter-select { flex: 1; min-width: 100px; padding: 8px 10px; border: 1px solid #e5e6e8; border-radius: 10px; font-size: 13px; background: rgba(255,255,255,.85); color: #1F2329; box-sizing: border-box; }
    .filter-select:focus { outline: none; border-color: #1456F0; }
    .mini-btn { padding: 8px 12px; border: none; border-radius: 10px; background: rgba(20,86,240,.1); color: #1456F0; font-size: 12px; font-weight: 600; cursor: pointer; }
    .mini-btn:hover { background: rgba(20,86,240,.18); }
    .toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: #1F2329; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px; z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,.25); display: none; max-width: 86%; text-align: center; animation: toast-in .2s ease; }
    .toast.success { background: #16a34a; }
    .toast.error { background: #ef4444; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .export-btn:hover { background: #15803d; }
    .export-link { margin-left: auto; font-size: 11px; font-weight: 600; color: #1456F0; cursor: pointer; text-decoration: none; flex: none; }
    .export-link:hover { text-decoration: underline; }
    .empty { font-size: 13px; color: #8F959E; text-align: center; padding: 24px 12px; }
    .section-title { font-size: 13px; font-weight: 700; color: #1F2329; margin: 4px 2px 10px; display: flex; align-items: center; gap: 6px; }
    .expand-btn { margin-left: auto; width: 26px; height: 26px; border: 1px solid #e5e6e8; border-radius: 8px; background: rgba(255,255,255,.7); color: #646A73; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
    .expand-btn:hover { background: #eef3ff; border-color: #1456F0; color: #1456F0; }
    .sec-tag { font-size: 10px; border: 1px solid; border-radius: 4px; padding: 0 4px; margin-left: 4px; line-height: 1.4; }
    .dismiss-btn { font-size: 11px; color: #8F959E; border: 1px solid #e5e6e8; border-radius: 6px; padding: 2px 8px; cursor: pointer; background: transparent; }
    .dismiss-btn:hover { color: #ef4444; border-color: #ef4444; }
    .dismiss-reasons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .reason-btn { font-size: 11px; color: #646A73; border: 1px solid #e5e6e8; border-radius: 6px; padding: 3px 8px; cursor: pointer; background: rgba(255,255,255,.7); }
    .reason-btn:hover { border-color: #ef4444; color: #ef4444; }
    .reason-cancel { color: #8F959E; }
    /* 窄屏（Side Panel 可拉窄）自适应：收 padding、降字号，避免内容被挤爆 */
    @media (max-width: 340px) {
      .view { padding: 8px; }
      .glass-card { padding: 10px; }
      .wb-card { padding: 10px; }
      .wb-tt { font-size: 12px; }
      .wb-reason { font-size: 10px; }
      .dim-bar { width: 36px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="head">
      <div class="avatar"><img id="avatar-img" src="avatar.svg" alt="" /></div>
      <div class="sub" id="sub">已就绪</div>
      <button class="expand-btn" id="act-expand" title="在新窗口打开（更大界面）">⤢</button>
    </div>
    <div class="view" id="view"></div>
    <div class="progress" id="progress"></div>
    <div class="nav" id="nav">
      <button class="nav-item active" data-step="resume"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>简历</button>
      <button class="nav-item" data-step="recommend"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>推荐</button>
      <button class="nav-item" data-step="apply"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>投递</button>
      <button class="nav-item" data-step="board"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>看板</button>
      <button class="nav-item nav-fill" id="act-fill"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>填表单</button>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
