<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 360px; max-height: 520px; overflow-y: auto; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; box-sizing: border-box; }
    h3 { margin: 0 0 10px; font-size: 16px; }
    #status { font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
    textarea { width: 100%; height: 72px; box-sizing: border-box; font-size: 12px; padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; resize: vertical; }
    .btn { width: 100%; padding: 9px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-ghost { background: #f3f4f6; color: #374151; }
    #progress { font-size: 12px; color: #6b7280; margin-top: 8px; min-height: 16px; }
    #recommend-list { margin-top: 8px; }
    .job { display: block; text-decoration: none; color: inherit; padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 6px; }
    .job:hover { background: #f9fafb; }
    .job-company { font-size: 13px; font-weight: 600; }
    .job-title { font-size: 12px; color: #4b5563; margin-top: 2px; }
    .tier { background: #eff6ff; color: #2563eb; font-size: 11px; padding: 1px 5px; border-radius: 4px; margin-right: 4px; }
    .score { color: #16a34a; font-size: 11px; }
    .empty { font-size: 12px; color: #9ca3af; text-align: center; padding: 12px; }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 10px; line-height: 1.5; }
    .divider { border-top: 1px solid #e5e7eb; margin: 12px 0; }
  </style>
</head>
<body>
  <h3>⭐ 求职星</h3>
  <div id="status">未导入画像</div>

  <input type="file" id="resume-file" accept=".pdf,.txt,.doc,.docx" style="font-size:12px;margin-bottom:8px;" />
  <textarea id="resume-input" placeholder="或粘贴简历文本（姓名/学校/专业/实习经历…）"></textarea>
  <button class="btn btn-ghost" id="parse-btn">① 解析画像</button>
  <button class="btn btn-primary" id="recommend-btn" disabled>② 推荐岗位</button>

  <div id="progress"></div>
  <div id="recommend-list"></div>

  <div class="divider"></div>
  <button class="btn btn-primary" id="fill-btn">③ 填充当前投递表单</button>
  <div class="hint">流程：解析简历 → 推荐岗位 → 点岗位跳官网投递页 → 自动填充。只自动填表，不自动提交。</div>
  <script src="popup.js"></script>
</body>
</html>
